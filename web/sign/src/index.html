<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所谓人生，就是为了变得温柔而存在的</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url("bg.webp") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .stbox {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.3);
            width: 1200px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* wpst{所谓人生，就是为了变得温柔而存在的} */
        .stbox div {
            line-height: 2;
            font-size: 32px;
            color: #333;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="stbox">
        <div>所谓人生，就是为了变得温柔而存在的</div>
        <div>「谢谢」 「很努力了呢」 「最喜欢了」 ——心怀着这三句话，勇敢地活下去</div>
    </div>
</body>

</html>
