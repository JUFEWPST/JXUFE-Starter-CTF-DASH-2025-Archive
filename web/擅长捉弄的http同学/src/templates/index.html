<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>擅长捉弄的http同学</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url("{{ url_for('static', filename=bg_path) }}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .stbox {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.3);
            width: 1200px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .stbox div {
            line-height: 2;
            font-size: 32px;
            color: #333;
            text-align: center;
            font-weight: bold;
            padding: 4px;
            box-sizing: border-box;
        }

        .addinfo {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.3);
            bottom: 10px;
            right: 10px;
            padding: 5px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="stbox">
        <div>{{msg}}</div>
    </div>
</body>

</html>
